name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Store builds include Recap Pro when the WXT_PRO_ORIGIN repository variable is set
      # (e.g. https://recapai.dev; a variable, not a secret, since the origin is public).
      # If it is unset, the release is a bring-your-own-key-only build.
      - run: pnpm zip
        env:
          WXT_PRO_ORIGIN: ${{ vars.WXT_PRO_ORIGIN }}
      - run: pnpm zip:firefox
        env:
          WXT_PRO_ORIGIN: ${{ vars.WXT_PRO_ORIGIN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
