name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          RECAP_VERSION: 2.0.${{ github.run_number }}
      - name: Pack the extension and version.json
        env:
          RECAP_VERSION: 2.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd .output/chrome-mv3 && zip -r "$GITHUB_WORKSPACE/recap-chrome-mv3.zip" .)
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("version.json", "w", encoding="utf-8") as fh:
              json.dump(
                  {
                      "version": os.environ["RECAP_VERSION"],
                      "sha": os.environ["GITHUB_SHA"],
                      "builtAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  },
                  fh,
              )
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" recap-chrome-mv3.zip version.json --clobber
            gh release edit "$TAG" --latest --title "$TAG"
          else
            gh release create "$TAG" recap-chrome-mv3.zip version.json \
              --latest \
              --title "$TAG" \
              --notes "Chrome MV3 build. Load unpacked from the zip, then Reload at chrome://extensions."
          fi
